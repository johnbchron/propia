[package]
name = "ipp-wire-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
ipp-wire = { path = "../crates/ipp-wire", features = [ "arbitrary" ] }
libfuzzer-sys = { version = "0.4" }
arbitrary = { workspace = true }

[[bin]]
name = "wire-tokens"
path = "fuzz_targets/wire-tokens.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire-streaming"
path = "fuzz_targets/wire-streaming.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire-reencode"
path = "fuzz_targets/wire-reencode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire-roundtrip"
path = "fuzz_targets/wire-roundtrip.rs"
test = false
doc = false
bench = false
