[package]
name = "ipp-wire-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { workspace = true }
ipp-wire = { path = "../crates/ipp-wire", features = [ "arbitrary" ] }
ipp-message = { path = "../crates/ipp-message" }
libfuzzer-sys = { version = "0.4" }

[[bin]]
name = "wire-tokens"
path = "fuzz_targets/wire-tokens.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire-streaming"
path = "fuzz_targets/wire-streaming.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire-reencode"
path = "fuzz_targets/wire-reencode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire-roundtrip"
path = "fuzz_targets/wire-roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message-structure"
path = "fuzz_targets/message-structure.rs"
test = false
doc = false
bench = false
